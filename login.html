<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Code Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --border:    #1e1e2e;
      --border-hi: #2e2e4a;
      --text:      #e8e8f0;
      --muted:     #6b6b8a;
      --accent:    #c8b8ff;
      --accent-dim:#7c6acd;
      --danger:    #ff6b7a;
      --success:   #6bffb8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { height: 100%; }

    body {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }

    /* ── Left panel ── */
    .panel-left {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3rem;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    /* Geometric decoration */
    .panel-left::before {
      content: '';
      position: absolute;
      top: -120px;
      left: -120px;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,184,255,0.07) 0%, transparent 70%);
      pointer-events: none;
    }

    .panel-left::after {
      content: '';
      position: absolute;
      bottom: -80px;
      right: -80px;
      width: 340px;
      height: 340px;
      border: 1px solid var(--border-hi);
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 0.5; }
      50%       { transform: scale(1.06); opacity: 1;   }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      animation: fadeDown 0.6s ease both;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border: 1px solid var(--accent-dim);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg { display: block; }

    .brand-name {
      font-family: 'DM Mono', monospace;
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text);
    }

    .panel-copy {
      animation: fadeUp 0.7s 0.15s ease both;
    }

    .panel-copy h2 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.2rem, 3.5vw, 3.2rem);
      line-height: 1.12;
      color: var(--text);
      margin-bottom: 1.25rem;
    }

    .panel-copy h2 em {
      font-style: italic;
      color: var(--accent);
    }

    .panel-copy p {
      font-size: 0.9375rem;
      color: var(--muted);
      line-height: 1.75;
      max-width: 28ch;
    }

    .panel-footer {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      animation: fadeUp 0.7s 0.25s ease both;
    }

    /* ── Right panel ── */
    .panel-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem 2rem;
    }

    .form-wrap {
      width: 100%;
      max-width: 380px;
      animation: fadeUp 0.65s 0.1s ease both;
    }

    .form-title {
      margin-bottom: 2.5rem;
    }

    .form-title h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      color: var(--text);
      margin-bottom: 0.375rem;
    }

    .form-title p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* Social login */
    .social-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1rem;
      background: transparent;
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .social-btn:hover {
      border-color: var(--accent-dim);
      color: var(--text);
      background: rgba(200,184,255,0.04);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 0.06em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* Field */
    .field {
      margin-bottom: 1.125rem;
      position: relative;
    }

    .field label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.5rem;
      transition: color 0.2s;
    }

    .field:focus-within label { color: var(--accent); }

    .input-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      padding: 0.75rem 2.75rem 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 8px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9375rem;
      font-weight: 300;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      -webkit-appearance: none;
    }

    .field input::placeholder { color: #3a3a58; }

    .field input:focus {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3px rgba(124,106,205,0.15);
    }

    .field input.error {
      border-color: var(--danger);
      box-shadow: 0 0 0 3px rgba(255,107,122,0.12);
    }

    .field-icon {
      position: absolute;
      right: 0.875rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .toggle-pw {
      pointer-events: all;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      color: var(--muted);
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: var(--accent); }

    .field-error {
      font-size: 0.75rem;
      color: var(--danger);
      margin-top: 0.375rem;
      min-height: 1rem;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.2s, transform 0.2s;
    }

    .field-error.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Options row */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.75rem;
      font-size: 0.8125rem;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] { display: none; }

    .checkbox-box {
      width: 16px;
      height: 16px;
      border: 1px solid var(--border-hi);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
    }

    .checkbox-label input:checked + .checkbox-box {
      background: var(--accent-dim);
      border-color: var(--accent-dim);
    }

    .checkbox-box svg { display: none; }
    .checkbox-label input:checked + .checkbox-box svg { display: block; }

    .forgot-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8125rem;
      transition: opacity 0.2s;
    }
    .forgot-link:hover { opacity: 0.7; }

    /* Submit */
    .submit-btn {
      width: 100%;
      padding: 0.875rem;
      background: var(--accent-dim);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .submit-btn:hover {
      background: #8b78e0;
      box-shadow: 0 4px 20px rgba(124,106,205,0.4);
    }

    .submit-btn:active { transform: scale(0.98); }

    .submit-btn.loading {
      pointer-events: none;
      color: transparent;
    }

    .submit-btn.loading::after {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .submit-btn.success {
      background: var(--accent-dim);
      pointer-events: none;
    }

    /* Sign up */
    .signup-row {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .signup-row a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .signup-row a:hover { opacity: 0.7; }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 10px;
      padding: 0.75rem 1.25rem;
      font-size: 0.875rem;
      color: var(--text);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      white-space: nowrap;
      z-index: 999;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success-toast { border-color: rgba(107,255,184,0.3); color: var(--success); }
    .toast.error-toast   { border-color: rgba(255,107,122,0.3); color: var(--danger); }

    /* Responsive */
    @media (max-width: 700px) {
      body { grid-template-columns: 1fr; }
      .panel-left { display: none; }
      .panel-right { padding: 2.5rem 1.5rem; min-height: 100svh; }
    }
  </style>
</head>
<body>

  <!-- Left decorative panel -->
  <div class="panel-left">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 5L2 9L5 13" stroke="#c8b8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13 5L16 9L13 13" stroke="#c8b8ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M11 3L7 15" stroke="#7c6acd" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">CODE STUDIO</span>
    </div>

    <div class="panel-copy">
      <h2>Build things<br />that <em>matter</em>.</h2>
      <p>A unified environment for engineers who care about craft, clarity, and moving fast without breaking things.</p>
    </div>

    <div class="panel-footer">© 2025 CODE STUDIO</div>
  </div>

  <!-- Right login panel -->
  <div class="panel-right">
    <div class="form-wrap">
      <div class="form-title">
        <h1>Welcome back</h1>
        <p>Sign in to continue to your workspace</p>
      </div>

      <!-- Social -->
      <div class="social-row">
        <button class="social-btn" type="button" aria-label="Continue with GitHub">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          GitHub
        </button>
        <button class="social-btn" type="button" aria-label="Continue with Google">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M5.266 9.765A7.077 7.077 0 0112 4.909c1.69 0 3.218.6 4.41 1.586l3.301-3.302A11.9 11.9 0 0012 1C7.392 1 3.387 3.604 1.386 7.404l3.88 2.361z"/><path fill="#34A853" d="M16.04 18.013c-1.09.703-2.474 1.078-4.04 1.078a7.077 7.077 0 01-6.723-4.823l-3.88 2.376C3.411 20.396 7.407 23 12 23c2.933 0 5.735-1.043 7.834-3l-3.793-2.987z"/><path fill="#4A90E2" d="M19.834 20c2.195-2.048 3.62-5.096 3.62-8 0-.702-.109-1.473-.272-2.182H12v4.637h6.436c-.317 1.559-1.17 2.766-2.395 3.558L19.834 20z"/><path fill="#FBBC05" d="M5.277 14.268A7.12 7.12 0 014.909 12c0-.782.125-1.533.357-2.235L1.386 7.404A11.938 11.938 0 001 12c0 1.businss614.28 3.067.78 4.58l4.497-2.312z"/></svg>
          Google
        </button>
      </div>

      <div class="divider">OR CONTINUE WITH EMAIL</div>

      <!-- Form -->
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
            <span class="field-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
          </div>
          <div class="field-error" id="email-error" role="alert"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
            <button class="field-icon toggle-pw" type="button" id="togglePw" aria-label="Toggle password visibility">
              <svg id="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <div class="field-error" id="password-error" role="alert"></div>
        </div>

        <div class="options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember" name="remember" />
            <span class="checkbox-box">
              <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span>Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Sign in</button>
      </form>

      <div class="signup-row">
        New to Code Studio? <a href="#">Create an account</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // Password visibility toggle
    const togglePw   = document.getElementById('togglePw');
    const pwInput    = document.getElementById('password');
    const eyeOpen    = document.getElementById('eye-open');
    const eyeClosed  = document.getElementById('eye-closed');

    togglePw.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      eyeOpen.style.display   = isHidden ? 'none'  : '';
      eyeClosed.style.display = isHidden ? ''      : 'none';
    });

    // Toast helper
    function showToast(msg, type = '') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show ' + (type ? type + '-toast' : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.className = 'toast'; }, 3500);
    }

    // Validation
    function validateEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    function setFieldError(id, msg) {
      const el = document.getElementById(id + '-error');
      const input = document.getElementById(id);
      el.textContent = msg;
      el.classList.toggle('show', !!msg);
      input.classList.toggle('error', !!msg);
    }

    // Form submit
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let valid = true;

      setFieldError('email', '');
      setFieldError('password', '');

      if (!email) {
        setFieldError('email', 'Email is required.');
        valid = false;
      } else if (!validateEmail(email)) {
        setFieldError('email', 'Enter a valid email address.');
        valid = false;
      }

      if (!password) {
        setFieldError('password', 'Password is required.');
        valid = false;
      } else if (password.length < 6) {
        setFieldError('password', 'Password must be at least 6 characters.');
        valid = false;
      }

      if (!valid) return;

      const btn = document.getElementById('submitBtn');
      btn.classList.add('loading');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json().catch(() => ({}));

        if (res.ok) {
          btn.classList.remove('loading');
          btn.classList.add('success');
          btn.textContent = 'Signed in ✓';
          showToast('Welcome back! Redirecting…', 'success');
          if (data.token) {
            localStorage.setItem('token', data.token);
          }
          setTimeout(() => { window.location.href = data.redirect || '/'; }, 1200);
        } else {
          btn.classList.remove('loading');
          const msg = data.message || 'Invalid email or password.';
          showToast(msg, 'error');
          setFieldError('password', msg);
        }
      } catch (_) {
        btn.classList.remove('loading');
        showToast('Network error. Please try again.', 'error');
      }
    });

    // Social button placeholders
    document.querySelectorAll('.social-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        showToast('OAuth not configured yet.');
      });
    });
  </script>
</body>
</html>
